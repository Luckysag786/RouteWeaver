name: Bug 报告
description: 报告可复现的功能或兼容性问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先隐藏公网 IP、用户名、代理凭据和内部域名。
  - type: input
    id: version
    attributes:
      label: RouteWeaver 版本
      placeholder: 例如 1.3.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options: [Windows 11, Windows 10, Android, 其他]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期望什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. 选择……\n2. 添加……\n3. 点击……"
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: 上游类型
      options: [HTTP, SOCKS5, 不确定, 不适用]
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的诊断信息
      description: 请勿粘贴代理密码、完整公网 IP 或个人路径。
  - type: checkboxes
    id: boundary
    attributes:
      label: 能力边界确认
      options:
        - label: 我已阅读平台能力边界，并确认该连接理论上会使用 Windows 系统代理。
          required: true
