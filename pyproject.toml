[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routeweaver"
version = "1.3.1"
description = "在现有本地代理前按应用和网站选择 VPN 或直连出口"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "RouteWeaver"}]
license = "MIT"
keywords = ["split-routing", "proxy", "vpn", "windows", "android"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Pillow>=10.0",
    "pystray>=0.19.5",
]

[project.urls]
Homepage = "https://github.com/Luckysag786/RouteWeaver"
Documentation = "https://luckysag786.github.io/RouteWeaver/"
Repository = "https://github.com/Luckysag786/RouteWeaver.git"
Issues = "https://github.com/Luckysag786/RouteWeaver/issues"
Changelog = "https://github.com/Luckysag786/RouteWeaver/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "pyinstaller>=6.0"]

[project.scripts]
routeweaver = "routeweaver.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
